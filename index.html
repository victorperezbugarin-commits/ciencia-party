<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ciencia Party</title>
    <style>
        /* Bloqueamos cualquier movimiento extraño de la pantalla */
        html, body { 
            position: fixed; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #1a2a6c; 
            font-family: sans-serif;
        }
        
        * { box-sizing: border-box; touch-action: none; }

        .pantalla { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            width: 100vw; 
            height: 100vh; 
            padding: 20px; 
            text-align: center;
            color: white;
        }
        .activa { display: flex; }

        .tarjeta { background: white; color: #333; padding: 15px; border-radius: 15px; width: 100%; max-width: 400px; margin-bottom: 10px; }
        
        /* Pizarra forzada */
        #pizarra { 
            background: #ffffff; 
            border: 5px solid #fdbb2d; 
            border-radius: 10px; 
            width: 100%; 
            max-width: 400px;
            height: 300px; 
            display: block;
        }
        
        .btn { background: #fdbb2d; color: #1a2a6c; border: none; padding: 15px; border-radius: 50px; font-weight: bold; width: 100%; max-width: 400px; cursor: pointer; margin-top: 10px; font-size: 1.1rem;}
        .oculto { display: none !important; }
    </style>
</head>
<body>

    <div id="p-inicio" class="pantalla activa">
        <h1>⚛️ CIENCIA PARTY</h1>
        <button class="btn" onclick="irAlJuego()">JUGAR AHORA</button>
    </div>

    <div id="p-juego" class="pantalla">
        <div class="tarjeta">
            <p id="preg" style="font-weight:bold; font-size:1.2rem"></p>
        </div>

        <div id="zona-dibujo" class="oculto" style="width:100%; max-width:400px;">
            <canvas id="pizarra"></canvas>
            <button onclick="borrar()" style="color:white; margin: 10px 0; background:none; border:1px solid white; padding:5px; border-radius:5px;">🗑️ Borrar</button>
        </div>

        <button id="btn-ver" class="btn" onclick="ver()">VER SOLUCIÓN</button>

        <div id="zona-res" class="oculto">
            <p id="res" style="margin-bottom:10px"></p>
            <button class="btn" onclick="siguiente()">SIGUIENTE RETO ➡️</button>
        </div>
    </div>

    <script>
        const lista = [
            { t: "d", q: "Dibuja un átomo (Núcleo y electrones)" },
            { t: "p", q: "¿Cuál es el símbolo del Hierro?", a: "Fe" },
            { t: "d", q: "Dibuja una probeta de laboratorio" },
            { t: "p", q: "¿pH de una sustancia neutra?", a: "7" }
        ];

        let actual = null;
        const canvas = document.getElementById('pizarra');
        const ctx = canvas.getContext('2d');
        let pintando = false;

        function irAlJuego() {
            document.getElementById('p-inicio').classList.remove('activa');
            document.getElementById('p-juego').classList.add('activa');
            // Ajuste manual de resolución
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            siguiente();
        }

        function siguiente() {
            document.getElementById('zona-res').classList.add('oculto');
            document.getElementById('btn-ver').classList.remove('oculto');
            borrar();

            actual = lista[Math.floor(Math.random() * lista.length)];
            document.getElementById('preg').innerText = actual.q;
            document.getElementById('res').innerText = actual.a || "¡Buen dibujo!";

            if(actual.t === "d") {
                document.getElementById('zona-dibujo').classList.remove('oculto');
            } else {
                document.getElementById('zona-dibujo').classList.add('oculto');
            }
        }

        function ver() {
            document.getElementById('btn-ver').classList.add('oculto');
            document.getElementById('zona-res').classList.remove('oculto');
        }

        function borrar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // --- SISTEMA DE DIBUJO REINVENTADO ---
        function obtenerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function empezar(e) {
            pintando = true;
            const p = obtenerPos(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            // Definimos el estilo aquí mismo
            ctx.strokeStyle = "#1a2a6c";
            ctx.lineWidth = 4;
            ctx.lineCap = "round";
        }

        function mover(e) {
            if (!pintando) return;
            const p = obtenerPos(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            // Muy importante para PC
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.strokeStyle = "#1a2a6c";
            ctx.lineWidth = 4;
            ctx.lineCap = "round";
        }

        function parar() { pintando = false; }

        // Eventos para todos los dispositivos
        canvas.addEventListener('mousedown', empezar);
        canvas.addEventListener('mousemove', mover);
        window.addEventListener('mouseup', parar);

        canvas.addEventListener('touchstart', function(e) {
            empezar(e);
            e.preventDefault();
        }, {passive: false});

        canvas.addEventListener('touchmove', function(e) {
            mover(e);
            e.preventDefault();
        }, {passive: false});

        canvas.addEventListener('touchend', parar);
    </script>
</body>
</html>
