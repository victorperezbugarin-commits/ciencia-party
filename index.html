<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciencia Party</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="pantalla-inicio" class="pantalla activa">
        <div class="contenedor-logo">
            <h1>⚛️ CIENCIA<br>PARTY</h1>
            <p>¿Podrás superar los retos del laboratorio?</p>
        </div>
        <button class="btn-grande" onclick="iniciarJuego()">JUGAR AHORA</button>
    </div>

    <div id="pantalla-juego" class="pantalla oculta">
        
        <div id="tarjeta-pregunta">
            <h3 id="categoria-pregunta">Categoría</h3>
            <p id="texto-pregunta">Cargando pregunta...</p>
        </div>

        <button id="btn-ver-solucion" class="btn-mediano" onclick="verSolucion()">👁️ Ver Solución</button>

        <div id="area-respuesta" class="oculta">
            <p class="solucion-titulo">Solución:</p>
            <p id="texto-solucion">Aquí saldrá la respuesta...</p>
            <button class="btn-siguiente" onclick="cargarSiguientePrueba()">➡️ Siguiente Pregunta</button>
        </div>

        <button class="btn-peque" onclick="volverInicio()">Salir al inicio</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
