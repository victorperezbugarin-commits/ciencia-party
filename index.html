<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ciencia Party</title>
    <style>
        /* TODO EL DISEÑO AQUÍ */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; touch-action: manipulation; }
        body { background: #1a2a6c; color: white; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .pantalla { width: 90%; max-width: 400px; display: none; flex-direction: column; text-align: center; }
        .activa { display: flex !important; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .tarjeta { background: white; color: #333; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        #pizarra { background: white; border: 2px solid #fdbb2d; border-radius: 10px; width: 100%; height: 200px; touch-action: none; margin-bottom: 10px; }
        .btn-principal { background: #fdbb2d; color: #1a2a6c; border: none; padding: 18px; border-radius: 50px; font-weight: bold; font-size: 1.2rem; cursor: pointer; width: 100%; margin-top: 10px; }
        .caja-res { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin: 15px 0; border: 1px dashed white; }
        .oculto { display: none !important; }
    </style>
</head>
<body>

    <div id="p-inicio" class="pantalla activa">
        <h1>⚛️ CIENCIA PARTY</h1>
        <p>Toca el botón para empezar</p>
        <button class="btn-principal" onclick="irAlJuego()">JUGAR AHORA</button>
    </div>

    <div id="p-juego" class="pantalla">
        <div class="tarjeta">
            <small id="cat" style="color:red; text-transform:uppercase"></small>
            <p id="preg" style="font-weight:bold; font-size:1.3rem; margin-top:10px"></p>
        </div>

        <div id="zona-dibujo" class="oculto">
            <canvas id="pizarra"></canvas>
            <button onclick="borrar()" style="margin-bottom:10px">Limpiar Dibujo</button>
        </div>

        <button id="btn-ver" class="btn-principal" onclick="ver()">Ver Solución</button>

        <div id="zona-res" class="oculto">
            <div class="caja-res">
                <p id="res"></p>
            </div>
            <button class="btn-principal" onclick="siguiente()">Siguiente Reto ➡️</button>
        </div>
    </div>

    <script>
        // TODO EL CEREBRO AQUÍ
        const lista = [
            { t: "p", c: "Física", q: "¿Cuál es la unidad de la fuerza?", a: "El Newton (N)" },
            { t: "d", c: "Dibujo", q: "Dibuja un átomo simple", a: "Debe tener núcleo y electrones" },
            { t: "p", c: "Química", q: "¿Símbolo del Hierro?", a: "Fe" },
            { t: "d", c: "Dibujo", q: "Dibuja una probeta", a: "Recipiente cilíndrico con marcas" }
        ];

        let actual = null;
        const canvas = document.getElementById('pizarra');
        const ctx = canvas.getContext('2d');
        let pintando = false;

        function irAlJuego() {
            document.getElementById('p-inicio').classList.remove('activa');
            document.getElementById('p-juego').classList.add('activa');
            // Ajuste de pizarra
            canvas.width = canvas.offsetWidth;
            canvas.height = 200;
            siguiente();
        }

        function siguiente() {
            document.getElementById('zona-res').classList.add('oculto');
            document.getElementById('btn-ver').classList.remove('oculto');
            borrar();

            actual = lista[Math.floor(Math.random() * lista.length)];
            
            document.getElementById('cat').innerText = actual.c;
            document.getElementById('preg').innerText = actual.q;
            document.getElementById('res').innerText = actual.a;

            if(actual.t === "d") {
                document.getElementById('zona-dibujo').classList.remove('oculto');
            } else {
                document.getElementById('zona-dibujo').classList.add('oculto');
            }
        }

        function ver() {
            document.getElementById('btn-ver').classList.add('oculto');
            document.getElementById('zona-res').classList.remove('oculto');
        }

        function borrar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
        }

        // DIBUJO SIMPLE
        function obtenerPos(e) {
            const r = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: cx - r.left, y: cy - r.top };
        }

        function iniciar(e) { pintando = true; const p = obtenerPos(e); ctx.moveTo(p.x, p.y); }
        function mover(e) { 
            if(!pintando) return; 
            const p = obtenerPos(e); 
            ctx.lineTo(p.x, p.y); 
            ctx.strokeStyle = "#1a2a6c"; 
            ctx.lineWidth = 3; 
            ctx.stroke(); 
        }
        function fin() { pintando = false; ctx.beginPath(); }

        canvas.addEventListener('mousedown', iniciar);
        canvas.addEventListener('mousemove', mover);
        window.addEventListener('mouseup', fin);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); iniciar(e); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); mover(e); });
        canvas.addEventListener('touchend', fin);
    </script>
</body>
</html>
