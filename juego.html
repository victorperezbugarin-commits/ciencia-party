<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ciencia Party - Versión Blindada</title>
    <style>
        body { background: #1a2a6c; color: white; font-family: sans-serif; margin: 0; overflow: hidden; text-align: center; }
        .pantalla { height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
        .activa { display: flex !important; }
        .tarjeta { background: white; color: #333; padding: 15px; border-radius: 15px; width: 95%; max-width: 400px; margin-bottom: 10px; }
        
        /* Contenedor de dibujo muy simple para evitar errores */
        #zona-dibujo { width: 95%; max-width: 400px; }
        canvas { 
            background: white; 
            border: 5px solid #fdbb2d; 
            border-radius: 10px; 
            width: 100%; 
            height: 300px; 
            display: block;
            touch-action: none; 
        }
        
        .btn { background: #fdbb2d; color: #1a2a6c; border: none; padding: 15px; border-radius: 50px; font-weight: bold; width: 95%; max-width: 400px; font-size: 1.2rem; cursor: pointer; margin-top: 10px; }
        .oculto { display: none !important; }
        #res-caja { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px; margin-top: 10px; width: 95%; }
    </style>
</head>
<body>

    <div id="p-inicio" class="pantalla activa">
        <h1>⚛️ CIENCIA PARTY</h1>
        <button class="btn" onclick="iniciar()">JUGAR AHORA</button>
    </div>

    <div id="p-juego" class="pantalla">
        <div class="tarjeta">
            <p id="preg" style="font-weight:bold; font-size:1.1rem"></p>
        </div>

        <div id="zona-dibujo" class="oculto">
            <canvas id="pizarra"></canvas>
            <button onclick="limpiar()" style="color:white; background:none; border:1px solid white; margin-top:5px; padding:5px; border-radius:5px;">🗑️ Borrar</button>
        </div>

        <button id="btn-ver" class="btn" onclick="ver()">VER RESPUESTA</button>

        <div id="zona-res" class="oculto">
            <div id="res-caja">
                <p id="res-texto"></p>
            </div>
            <button class="btn" onclick="siguiente()">SIGUIENTE RETO ➡️</button>
        </div>
    </div>

    <script>
        const lista = [
            { t: "d", q: "Dibuja un matraz Erlenmeyer", a: "Cuerpo cónico y cuello cilíndrico" },
            { t: "p", q: "¿Cuál es el símbolo del Potasio?", a: "K" },
            { t: "d", q: "Dibuja un átomo (núcleo y electrones)", a: "El núcleo en el centro" },
            { t: "p", q: "¿Cuál es la unidad de masa en el SI?", a: "El Kilogramo (kg)" }
        ];

        let actual = null;
        const canvas = document.getElementById('pizarra');
        const ctx = canvas.getContext('2d');
        let pintando = false;

        function iniciar() {
            document.getElementById('p-inicio').classList.remove('activa');
            document.getElementById('p-juego').classList.add('activa');
            
            // Ajustar el canvas al tamaño real visible
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            
            siguiente();
        }

        function siguiente() {
            document.getElementById('zona-res').classList.add('oculto');
            document.getElementById('btn-ver').classList.remove('oculto');
            limpiar();

            actual = lista[Math.floor(Math.random() * lista.length)];
            document.getElementById('preg').innerText = actual.q;
            document.getElementById('res-texto').innerText = "Solución: " + actual.a;

            if (actual.t === "d") {
                document.getElementById('zona-dibujo').classList.remove('oculto');
            } else {
                document.getElementById('zona-dibujo').classList.add('oculto');
            }
        }

        function ver() {
            document.getElementById('btn-ver').classList.add('oculto');
            document.getElementById('zona-res').classList.remove('oculto');
        }

        function limpiar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Re-configurar estilo tras limpiar
            ctx.strokeStyle = "blue";
            ctx.lineWidth = 5;
            ctx.lineCap = "round";
        }

        // --- LÓGICA DE DIBUJO MATEMÁTICA ---
        function obtenerPunto(e) {
            const rect = canvas.getBoundingClientRect();
            // Esta parte detecta si es dedo o ratón
            const clienteX = e.touches ? e.touches[0].clientX : e.clientX;
            const clienteY = e.touches ? e.touches[0].clientY : e.clientY;
            
            return {
                x: clienteX - rect.left,
                y: clienteY - rect.top
            };
        }

        function empezar(e) {
            pintando = true;
            const p = obtenerPunto(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            // Forzar color azul fuerte
            ctx.strokeStyle = "blue";
            ctx.lineWidth = 5;
            if(e.touches) e.preventDefault();
        }

        function mover(e) {
            if (!pintando) return;
            const p = obtenerPunto(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            if(e.touches) e.preventDefault();
        }

        function terminar() {
            pintando = false;
        }

        // Eventos
        canvas.addEventListener('mousedown', empezar);
        canvas.addEventListener('mousemove', mover);
        window.addEventListener('mouseup', terminar);

        canvas.addEventListener('touchstart', empezar, {passive: false});
        canvas.addEventListener('touchmove', mover, {passive: false});
        canvas.addEventListener('touchend', terminar);

    </script>
</body>
</html>
