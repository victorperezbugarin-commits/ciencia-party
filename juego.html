<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ciencia Party - Física y Química</title>
    <style>
        :root { --azul: #1a2a6c; --oro: #fdbb2d; }
        body { background: var(--azul); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; touch-action: none; }
        
        .contenedor { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .tarjeta { background: white; color: #333; padding: 20px; border-radius: 15px; width: 100%; max-width: 350px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        
        canvas { background: #f0f0f0; border: 4px solid var(--oro); border-radius: 10px; cursor: crosshair; margin: 15px 0; touch-action: none; }
        
        .btn { background: var(--oro); color: var(--azul); padding: 15px 30px; border-radius: 50px; font-weight: bold; border: none; cursor: pointer; width: 100%; max-width: 300px; font-size: 1.1rem; margin-top: 10px; }
        .oculto { display: none; }
        .solucion-caja { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-top: 15px; border-left: 5px solid var(--oro); }
    </style>
</head>
<body>

    <div id="inicio" class="contenedor">
        <h1 style="font-size: 2.5rem;">⚛️ CIENCIA<br>PARTY</h1>
        <p>¿Podrás superar los retos del laboratorio?</p>
        <button class="btn" onclick="comenzar()">EMPEZAR JUEGO</button>
    </div>

    <div id="juego" class="contenedor oculto">
        <div class="tarjeta">
            <h3 id="categoria" style="color: #b21f1f; font-size: 0.8rem; text-transform: uppercase;"></h3>
            <p id="pregunta" style="font-size: 1.2rem; font-weight: bold; margin-top: 10px;"></p>
        </div>

        <canvas id="pizarra" width="320" height="300"></canvas>
        
        <button id="btn-revisar" class="btn" onclick="revisar()">VER SOLUCIÓN</button>

        <div id="solucion" class="oculto" style="width: 100%; max-width: 350px;">
            <div class="solucion-caja">
                <p id="respuesta"></p>
            </div>
            <button class="btn" onclick="siguiente()">SIGUIENTE RETO ➡️</button>
        </div>
        
        <button onclick="limpiar()" style="background:none; border:none; color:white; text-decoration:underline; margin-top:15px; font-size:0.8rem;">Limpiar pizarra</button>
    </div>

    <script>
        // BASE DE DATOS DE TUS APUNTES
        const lista = [
            {cat: "Material de Laboratorio 🧪", q: "Dibuja un matraz Erlenmeyer", a: "Cuerpo cónico, cuello cilíndrico y base plana."},
            {cat: "Estructura Atómica ⚛️", q: "¿Cuál es el símbolo del Potasio?", a: "Es la letra K."},
            {cat: "Formulación ✍️", q: "Dibuja la molécula del agua (H2O)", a: "Un átomo de Oxígeno grande y dos de Hidrógeno más pequeños."},
            {cat: "Leyes de la Física 🚀", q: "¿En qué unidad se mide la Fuerza?", a: "Se mide en Newtons (N)."},
            {cat: "Electricidad ⚡", q: "Dibuja un circuito con una pila y una bombilla", a: "Debe ser un camino cerrado que conecte ambos polos."},
            {cat: "Tabla Periódica ⚗️", q: "¿Qué elemento tiene el símbolo 'Fe'?", a: "El Hierro."},
            {cat: "Cambios de Estado 🌡️", q: "Dibuja el paso de Líquido a Gas (Evaporación)", a: "Representa gotas convirtiéndose en nubes o vapor."},
            {cat: "Modelos Atómicos 🔬", q: "Dibuja el modelo de Thomson (Pudin de pasas)", a: "Una esfera positiva con electrones negativos incrustados."}
        ];
        
        const canvas = document.getElementById('pizarra');
        const ctx = canvas.getContext('2d');
        let pintando = false;

        function comenzar() {
            document.getElementById('inicio').classList.add('oculto');
            document.getElementById('juego').classList.remove('oculto');
            siguiente();
        }

        function siguiente() {
            document.getElementById('solucion').classList.add('oculto');
            document.getElementById('btn-revisar').classList.remove('oculto');
            limpiar();
            const r = lista[Math.floor(Math.random() * lista.length)];
            document.getElementById('categoria').innerText = r.cat;
            document.getElementById('pregunta').innerText = r.q;
            document.getElementById('respuesta').innerText = "SOLUCIÓN: " + r.a;
        }

        function revisar() {
            document.getElementById('btn-revisar').classList.add('oculto');
            document.getElementById('solucion').classList.remove('oculto');
        }

        function limpiar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#1a2a6c";
            ctx.lineWidth = 4;
            ctx.lineCap = "round";
        }

        // LÓGICA DE DIBUJO (LA QUE FUNCIONA)
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            return {x, y};
        }

        function start(e) {
            pintando = true;
            ctx.beginPath();
            const p = getPos(e);
            ctx.moveTo(p.x, p.y);
            if(e.touches) e.preventDefault();
        }

        function move(e) {
            if (!pintando) return;
            const p = getPos(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            if(e.touches) e.preventDefault();
        }

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', move);
        window.addEventListener('mouseup', () => pintando = false);

        canvas.addEventListener('touchstart', start, {passive: false});
        canvas.addEventListener('touchmove', move, {passive: false});
        canvas.addEventListener('touchend', () => pintando = false);
    </script>
</body>
</html>
