<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ciencia Party</title>
    <style>
        body { background: #1a2a6c; color: white; font-family: sans-serif; text-align: center; margin: 0; overflow: hidden; }
        .pantalla { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #pizarra { background: white; border: 5px solid #fdbb2d; touch-action: none; width: 100%; max-width: 350px; height: 300px; }
        .btn { background: #fdbb2d; padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; border: none; margin: 10px; color: #1a2a6c; font-size: 1.1rem; }
        .oculto { display: none !important; }
        .tarjeta { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; margin-bottom: 10px; width: 100%; max-width: 350px; }
    </style>
</head>
<body>

    <div id="p-inicio" class="pantalla">
        <h1>⚛️ CIENCIA PARTY</h1>
        <p>Retos de Física y Química</p>
        <button class="btn" onclick="irAlJuego()">JUGAR AHORA</button>
    </div>

    <div id="p-juego" class="pantalla oculto">
        <div class="tarjeta">
            <p id="preg" style="font-weight:bold;"></p>
        </div>

        <div id="zona-pizarra" class="oculto">
            <canvas id="pizarra"></canvas>
            <button style="color:white; background:none; border:none; text-decoration:underline;" onclick="borrar()">Limpiar dibujo</button>
        </div>

        <button id="btn-ver" class="btn" onclick="ver()">VER SOLUCIÓN</button>

        <div id="zona-res" class="oculto">
            <p id="res" style="background:white; color:#333; padding:10px; border-radius:10px;"></p>
            <button class="btn" onclick="siguiente()">SIGUIENTE ➡️</button>
        </div>
    </div>

    <script>
        const lista = [
            { t: "d", q: "Dibuja una probeta", a: "Recipiente cilíndrico graduado" },
            { t: "p", q: "¿Cuál es el símbolo del Hierro?", a: "Fe" },
            { t: "d", q: "Dibuja un átomo", a: "Núcleo y electrones" },
            { t: "p", q: "¿Qué mide un termómetro?", a: "La temperatura" }
        ];

        let actual = null;
        const canvas = document.getElementById('pizarra');
        const ctx = canvas.getContext('2d');
        let pintando = false;

        function irAlJuego() {
            document.getElementById('p-inicio').classList.add('oculto');
            document.getElementById('p-juego').classList.remove('oculto');
            
            // Forzamos el tamaño del dibujo igual que en el test
            setTimeout(() => {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                siguiente();
            }, 200);
        }

        function siguiente() {
            document.getElementById('zona-res').classList.add('oculto');
            document.getElementById('btn-ver').classList.remove('oculto');
            borrar();

            actual = lista[Math.floor(Math.random() * lista.length)];
            document.getElementById('preg').innerText = actual.q;
            document.getElementById('res').innerText = "Respuesta: " + actual.a;

            if (actual.t === "d") {
                document.getElementById('zona-pizarra').classList.remove('oculto');
            } else {
                document.getElementById('zona-pizarra').classList.add('oculto');
            }
        }

        function ver() {
            document.getElementById('btn-ver').classList.add('oculto');
            document.getElementById('zona-res').classList.remove('oculto');
        }

        function borrar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "blue";
            ctx.lineWidth = 6;
            ctx.lineCap = "round";
        }

        // LÓGICA DE DIBUJO DEL TEST QUE FUNCIONÓ
        function obtenerPos(e) {
            const r = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: cx - r.left, y: cy - r.top };
        }

        function iniciar(e) {
            pintando = true;
            const p = obtenerPos(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            if(e.touches) e.preventDefault();
        }

        function mover(e) {
            if (!pintando) return;
            const p = obtenerPos(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            if(e.touches) e.preventDefault();
        }

        function fin() { pintando = false; }

        canvas.addEventListener('mousedown', iniciar);
        canvas.addEventListener('mousemove', mover);
        window.addEventListener('mouseup', fin);

        canvas.addEventListener('touchstart', iniciar, {passive: false});
        canvas.addEventListener('touchmove', mover, {passive: false});
        canvas.addEventListener('touchend', fin);
    </script>
</body>
</html>
